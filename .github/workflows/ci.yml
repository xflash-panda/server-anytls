name: CI

on:
  push:
    branches:
      - dev/agent-master
      - agent-master
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - ".golangci.yml"
  pull_request:
    branches:
      - dev/agent-master
      - agent-master
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - ".golangci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Configure private modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          go env -w GOPRIVATE=github.com/xflash-panda/*
          git config --global url."https://${GH_PAT}@github.com/xflash-panda/".insteadOf "https://github.com/xflash-panda/"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Configure private modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          go env -w GOPRIVATE=github.com/xflash-panda/*
          git config --global url."https://${GH_PAT}@github.com/xflash-panda/".insteadOf "https://github.com/xflash-panda/"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
