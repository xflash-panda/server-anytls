name: CI

on:
  push:
    branches:
      - master
      - dev/master
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - ".golangci.yml"
  pull_request:
    branches:
      - master
      - dev/master
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - ".golangci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Configure private modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          go env -w GOPRIVATE=github.com/xflash-panda/*
          git config --global url."https://${GH_PAT}@github.com/xflash-panda/".insteadOf "https://github.com/xflash-panda/"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Configure private modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          go env -w GOPRIVATE=github.com/xflash-panda/*
          git config --global url."https://${GH_PAT}@github.com/xflash-panda/".insteadOf "https://github.com/xflash-panda/"
      - name: Run tests
        run: go test -v -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Configure private modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          go env -w GOPRIVATE=github.com/xflash-panda/*
          git config --global url."https://${GH_PAT}@github.com/xflash-panda/".insteadOf "https://github.com/xflash-panda/"
      - name: Build
        run: go build -v ./...
